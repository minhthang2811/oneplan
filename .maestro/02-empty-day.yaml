# The empty day — the one high-traffic screen Pupu is allowed to appear on.
#
# Steps forward to a date with nothing on it rather than deleting the seeded
# day, so the flow leaves the user's data alone and can be run repeatedly.
appId: com.pupu.app
name: Empty day — Pupu asleep
---
- launchApp

# Guard: if this run lands in onboarding, this flow has nothing to assert.
- assertVisible: "Today"

# "Next day" is the chevron's accessibilityLabel. Two days forward is past
# anything the seed puts on the calendar.
- tapOn: "Next day"
- tapOn: "Next day"

- assertVisible: "Nothing here yet"
# Selectors are FULL regex matches — a bare prefix would fail here.
- assertVisible: "Add one thing you want to get done.*"
- takeScreenshot: artifacts/04-empty-day-pupu-rest

# Me carries Pupu too — the closest thing the app has to a profile picture.
- tapOn: "Me"
- assertVisible: "Me"
- assertVisible: "Run onboarding again"
- takeScreenshot: artifacts/05-me-pupu-sit
