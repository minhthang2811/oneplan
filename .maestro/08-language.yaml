# Language — the picker, and that the whole app actually follows it.
#
# The assertions deliberately land on THREE different surfaces after the switch:
# the picker itself, a tab bar label, and a screen title. A language bug that
# only reached the screen you were looking at would pass a single-surface check
# and still ship an app that is half English.
#
# The flow restores "System" at the end, so it leaves the simulator in the state
# every other flow in this suite expects to find.
appId: com.minhthang.pupu
name: Language — switch to Vietnamese and back
---
- launchApp

# Guard: if this run lands in onboarding, this flow has nothing to assert.
- assertVisible: "Today"

- tapOn: "Me"
- assertVisible: "Run onboarding again"

# The row shows the MODE while following the phone, not the resolved language —
# that distinction is the reason the System row exists at all.
- tapOn: "Language"
# `.*` BECAUSE A `ChoiceRow` FOLDS ITS HINT INTO ITS LABEL. The System row
# exposes "System. Follows your device · English" as one accessibility element,
# and a Maestro selector is a FULL-string regex — so the bare word never matched
# once that row gained its hint.
- assertVisible: "System.*"
# Endonyms, never translated names. This is the promise the screen makes to
# someone who cannot read the language they have landed in.
- assertVisible: "English"
- assertVisible: "Tiếng Việt"
- takeScreenshot: artifacts/11-language-picker

- tapOn: "Tiếng Việt"

# 1. The picker relabels itself in place.
- assertVisible: "Ngôn ngữ"
- takeScreenshot: artifacts/12-language-vietnamese

- tapOn: "Quay lại"

# 2. The screen behind it, which was never remounted.
- assertVisible: "Làm lại phần giới thiệu"
- assertVisible: "Tôi"

# 3. The tab bar, which lives outside every screen.
- assertVisible: "Hôm nay"
- assertVisible: "Tập trung"
- tapOn: "Tập trung"
# `.*` RATHER THAN THE WHOLE SENTENCE: the Vietnamese line now ends in a
# question mark, and a Maestro selector is a regex — a trailing `?` would be
# read as "the previous character is optional" and the literal `?` in the text
# would go unmatched. Escaping it works too; stopping before it is harder to
# get wrong the next time this copy is reworded.
- assertVisible: "Bạn muốn biến mất trong bao lâu.*"
- takeScreenshot: artifacts/13-focus-vietnamese

# Back to following the phone, so the rest of the suite sees English again.
- tapOn: "Tôi"
- tapOn: "Ngôn ngữ"
- tapOn: "Hệ thống.*"
- assertVisible: "Language"
- tapOn: "Back"
- assertVisible: "Run onboarding again"
